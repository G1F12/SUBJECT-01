name: Manual live source-content replay
on:
  workflow_dispatch:
jobs:
  live-source-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Re-fetch publicly accessible raw and reproduce complete content inspection
        run: python research/observability_2026_11_04/inspect_data.py --check
      - name: Re-fetch licensed CPET members and verify real measurement summaries without refitting
        run: python research/calibration_2026_11_04/native_replay.py
