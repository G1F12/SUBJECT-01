name: Validate research repository
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducibility requirements
        run: pip install -r requirements.txt
      - name: Replay measured CPET snapshots and fixed systemic-cost test (offline, not new validation)
        run: python research/calibration_2026_11_04/reproduce.py
      - name: Structural and hash audit
        run: python tools/validate_repository.py
      - name: Recompute baseline CSVs in isolated directory
        run: python tools/reproduce_foundation.py
      - name: Audit Foundation conservation and feasibility bounds
        run: python tools/audit_foundation.py
      - name: Integrated physiological invariants and input provenance
        run: python research/integrated_2026_11_01/test_model.py
      - name: Reproduce integrated experiments with fixed seed
        run: python research/integrated_2026_11_01/experiments.py --check
      - name: Verify CPE45 measurement functions (synthetic, not physiological validation)
        run: python -m unittest discover -s tests -p test_cpe45.py
      - name: Verify dynamic CPE45 physical and data invariants
        run: python research/cpe45_2026_11_04/test_model.py
      - name: Reproduce dynamic CPE45 scenarios and held-participant endpoint errors
        run: python research/cpe45_2026_11_04/experiments.py --check
      - name: Verify recovery physics, identifiability and locked-test leakage controls
        run: python research/recovery_2026_11_04/test_recovery.py
      - name: Reproduce locked independent recovery endpoint and negative diagnostics
        run: python research/recovery_2026_11_04/reproduce.py --check
      - name: Verify observability symmetries, quotient reduction and isolation from viewed outcomes
        run: python research/observability_2026_11_04/test_observability.py
      - name: Verify retained licensed XLS content and archived source audit (offline, not live retrieval)
        run: python research/observability_2026_11_04/inspect_data.py --check-offline
      - name: Reproduce conditional measurement design, FIM and synthetic stress results
        run: python research/observability_2026_11_04/audit.py --check
      - name: Verify real-data calibration, measurement maps and locked-test isolation
        run: python -m unittest discover -s research/calibration_2026_11_04 -p test_calibration.py
      - name: Verify Cycle 7 local muscle bridge identifiability and data audit
        run: python -m unittest discover -s research/local_muscle_bridge_2026_11_07 -p test_local_bridge.py
      - name: Verify Cycle 8 empirical anchors, measurement maps and thermodynamic scaling
        run: python -m unittest discover -s research/empirical_anchors_2026_11_08 -p test_empirical_anchors.py
      - name: Verify Cycle 9 empirical recruitment, volume conduction and LOSO validation
        run: python -m unittest discover -s research/empirical_recruitment_2026_11_08 -p test_empirical_recruitment.py
      - name: Verify Evidence Gate V2 and negative testing battery
        run: python -m unittest discover -s tests -p test_evidence_gate_v2.py
      - name: Verify Rehman XLSX processor and negative tests
        run: python -m unittest discover -s tests -p test_rehman_xlsx_processor.py
      - name: Verify Rehman real PCr model validation and scientific freeze
        run: python -m unittest discover -s tests -p test_rehman_model_validation.py
      - name: Verify ACTES CPET multi-subject validation and report structural consistency
        run: python -m unittest discover -s tests -p test_actes_cpet_validation.py
      - name: Verify Malaga Treadmill CPET subject-level GroupKFold and negative tests
        run: python -m unittest discover -s tests -p test_malaga_cpet_validation.py
      - name: Verify Malaga report table generation and structural consistency
        run: python tools/generate_malaga_report_tables.py
